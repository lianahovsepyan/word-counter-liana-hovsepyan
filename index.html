<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Counter</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; transition: background 0.3s; }
    textarea { width: 100%; height: 150px; margin-bottom: 1rem; }
    .stats { display: flex; gap: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Text Counter</h1>
  <textarea id="textInput" placeholder="Type or paste text..."></textarea>
  <div class="stats">
    <p>Letters: <span id="letterCount">0</span></p>
    <p>Words: <span id="wordCount">0</span></p>
    <p>Sentences: <span id="sentenceCount">0</span></p>
  </div>
  <button id="bgBtn">Change Background 🎨</button>

  <script src="script.js"></script>
</body>
</html>
